<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotlight Links | AI Search Visibility Console.</title>
    <meta
      name="description"
      content="Please Enter Your Business Name and Zip Code to begin. Find out exactly what ChatGPT, Gemini, Claude, and Perplexity tell customers about your business — and fix what's costing you the recommendation.


Answer Engine Optimization and Generative Engine Optimization for small and medium sized businesses across the US."
    />
    <!--
      Set the theme attribute before first paint to avoid a flash of the wrong
      theme. Only an explicit light/dark choice is applied here; "system" (or no
      stored value) leaves the attribute off so index.css's prefers-color-scheme
      media query decides. Kept in sync afterward by src/context/theme-context.tsx.
    -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
