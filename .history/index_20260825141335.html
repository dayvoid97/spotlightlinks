<!DOCTYPE html>

    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph / Twitter. These are the site-wide defaults for the SPA shell.
         scripts/prerender.mjs rewrites this block per route at build time —
         title, description, og:*, twitter:*, plus an og:url and a canonical it
         inserts right after og:type — and writes the result to
         dist/<route>/index.html. Keep the tags below on one line each, in this
         shape: the prerenderer matches them by regex. There is deliberately no
         canonical here, because a hardcoded one would tell Google every route
         that falls through to the SPA is a duplicate of the homepage. -->
    <meta property="og:site_name" content="Spotlight Links" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Spotlight Links | Let us spotlight your business" />
    <meta
      property="og:description"
      content="Discover whether Google Gemini, ChatGPT, Claude, and Perplexity recommend your business to customers nearby. Answer Engine Optimization, Generative Engine Optimization, and Technology solutions for small and medium sized businesses across the US. Starting at $79/month."
    />
    <meta property="og:image" content="https://spotlightlinks.com/favicon.svg" />
    <meta property="og:image:width" content="1408" />
    <meta property="og:image:height" content="768" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spotlight Links | Let us spotlight your business" />
    <meta
      name="twitter:description"
      content="Discover whether Google Gemini, ChatGPT, Claude, and Perplexity recommend your business to customers nearby. Answer Engine Optimization, Generative Engine Optimization, and Technology solutions for small and medium sized businesses across the US. Starting at $79/month."
    />
    <meta
      name="twitter:image"
      content="https://spotlightlinks.com/mediasets/aeo-for-brick-and-mortar.png"
    />

    <!-- Google Consent Mode v2 (Default: Analytics Active, Ads Denied) -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }

      // Collect analytics immediately on landing; keep ad tracking restricted
      gtag('consent', 'default', {
        analytics_storage: 'granted',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500,
      })
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G6THVSG91B"></script>
    <script>
      gtag('js', new Date())
      gtag('config', 'G-G6THVSG91B')
    </script>

    <!-- Theme Initialization Script -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
